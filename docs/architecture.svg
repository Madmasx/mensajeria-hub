<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" fill="none">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1100" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0910"/>
      <stop offset="1" stop-color="#120d1c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6f5a86"/>
    </marker>
    <pattern id="agrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#221a2e" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1100" height="520" rx="20" fill="url(#abg)"/>
  <rect width="1100" height="520" rx="20" fill="url(#agrid)" opacity="0.4"/>
  <rect x="1" y="1" width="1098" height="518" rx="20" stroke="#2c2138"/>

  <text x="40" y="46" font-family="Inter, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#f2e9ff">Arquitectura</text>
  <text x="40" y="70" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#8f7aa8">Una ventana · N cuentas · una partición aislada por cuenta</text>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <circle cx="700" cy="62" r="4" fill="#9c6bde"/>
    <text x="712" y="66" font-size="10" fill="#b7a4cc">activa · renderer en memoria</text>
    <rect x="866" y="55" width="16" height="14" rx="4" fill="none" stroke="#f59e0b" stroke-dasharray="3 2"/>
    <text x="890" y="66" font-size="10" fill="#b7a4cc">suspendida · sesión en disco</text>
  </g>

  <!-- UI renderer -->
  <rect x="40" y="100" width="250" height="180" rx="14" fill="#120e19" stroke="#3a2c4f"/>
  <text x="58" y="127" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e8dcff">UI · renderer</text>
  <text x="58" y="143" font-family="Inter, 'Segoe UI', sans-serif" font-size="9" fill="#6f608a">HTML/CSS/TS · sin Node</text>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="10" fill="#c9bade">
    <text x="58" y="170">Barra lateral: grupos y cuentas</text>
    <text x="58" y="190">Atajos, ajustes y confirmaciones</text>
    <text x="58" y="210">Indicadores de no leídos</text>
  </g>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8.5">
    <rect x="58" y="232" width="98" height="20" rx="10" fill="#1a1326" stroke="#3a2c4f"/>
    <text x="66" y="245" fill="#a896bf">contextIsolation</text>
    <rect x="164" y="232" width="62" height="20" rx="10" fill="#1a1326" stroke="#3a2c4f"/>
    <text x="172" y="245" fill="#a896bf">sandbox</text>
  </g>

  <!-- main process -->
  <rect x="330" y="100" width="360" height="330" rx="14" fill="#130e1c" stroke="#4a3766"/>
  <text x="350" y="128" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e8dcff">Proceso principal · Electron</text>
  <text x="350" y="145" font-family="Inter, 'Segoe UI', sans-serif" font-size="9" fill="#6f608a">Node.js + API de Electron</text>

  <rect x="350" y="160" width="320" height="66" rx="10" fill="#1a1326" stroke="#5b437a"/>
  <text x="364" y="182" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e8dcff">ViewManager</text>
  <text x="364" y="198" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#a896bf">crea, muestra y suspende cada WebContentsView</text>
  <text x="364" y="213" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#a896bf">una vista visible a la vez · atajos · no leídos</text>

  <rect x="350" y="236" width="320" height="54" rx="10" fill="#1a1326" stroke="#3a2c4f"/>
  <text x="364" y="257" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e8dcff">Seguridad</text>
  <text x="364" y="273" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#a896bf">allowlist de orígenes · permisos mínimos · preload aislado</text>

  <rect x="350" y="300" width="320" height="54" rx="10" fill="#1a1326" stroke="#3a2c4f"/>
  <text x="364" y="321" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e8dcff">Suspensión</text>
  <text x="364" y="337" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#a896bf">1 setTimeout por cuenta oculta · sin polling</text>

  <rect x="350" y="364" width="320" height="50" rx="10" fill="#1a1326" stroke="#3a2c4f"/>
  <text x="364" y="385" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e8dcff">Bandeja + notificaciones</text>
  <text x="364" y="401" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#a896bf">icono de estado · nombre de cuenta en el título</text>

  <!-- arrows -->
  <line x1="290" y1="190" x2="326" y2="190" stroke="#6f5a86" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="296" y="182" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#8f7aa8">IPC</text>
  <line x1="690" y1="190" x2="726" y2="190" stroke="#6f5a86" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="692" y="182" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#8f7aa8">view</text>

  <!-- accounts -->
  <text x="730" y="127" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e8dcff">Cuentas · WebContentsView</text>
  <text x="730" y="143" font-family="Inter, 'Segoe UI', sans-serif" font-size="9" fill="#6f608a">session.fromPartition("persist:&lt;id&gt;")</text>

  <rect x="730" y="158" width="330" height="82" rx="12" fill="#241a33" stroke="#9c6bde" stroke-width="1.5"/>
  <circle cx="752" cy="181" r="7" fill="#25d366"/>
  <text x="768" y="185" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f2e9ff">WhatsApp Trabajo</text>
  <text x="768" y="200" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" fill="#c9bade">activa · renderer cargado en memoria</text>
  <rect x="744" y="211" width="152" height="19" rx="9" fill="#1a1326" stroke="#5b437a"/>
  <text x="754" y="224" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#c9bade">persist:wa-trabajo</text>
  <rect x="1012" y="169" width="36" height="17" rx="8.5" fill="#9c6bde"/>
  <text x="1030" y="181" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#ffffff">3</text>

  <rect x="730" y="250" width="330" height="64" rx="12" fill="#130e19" stroke="#6b557f" stroke-dasharray="6 4"/>
  <circle cx="752" cy="272" r="7" fill="#229ed9" opacity="0.6"/>
  <text x="768" y="276" font-family="Inter, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#cbbddf">Telegram Trabajo</text>
  <text x="768" y="291" font-family="Inter, 'Segoe UI', sans-serif" font-size="8" fill="#f59e0b">suspendida · sesión conservada en disco</text>
  <text x="744" y="308" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#8f7aa8">persist:tg-trabajo</text>

  <rect x="730" y="324" width="330" height="64" rx="12" fill="#130e19" stroke="#6b557f" stroke-dasharray="6 4"/>
  <circle cx="752" cy="346" r="7" fill="#25d366" opacity="0.6"/>
  <text x="768" y="350" font-family="Inter, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#cbbddf">WhatsApp Personal</text>
  <text x="768" y="365" font-family="Inter, 'Segoe UI', sans-serif" font-size="8" fill="#f59e0b">suspendida · sesión conservada en disco</text>
  <text x="744" y="382" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#8f7aa8">persist:wa-personal</text>

  <!-- disk -->
  <line x1="895" y1="388" x2="895" y2="404" stroke="#6f5a86" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="730" y="408" width="330" height="70" rx="12" fill="#0f0c15" stroke="#3a2c4f"/>
  <text x="744" y="430" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e8dcff">Disco · ~/.config/mensajeria-hub</text>
  <text x="744" y="447" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="8" fill="#a896bf">Partitions/&lt;id&gt;/</text>
  <text x="744" y="463" font-family="Inter, 'Segoe UI', sans-serif" font-size="8" fill="#6f608a">cookies · localStorage · IndexedDB · caché</text>

  <!-- external browser -->
  <rect x="330" y="444" width="360" height="40" rx="10" fill="#120e19" stroke="#3a2c4f"/>
  <text x="350" y="469" font-family="Inter, 'Segoe UI', sans-serif" font-size="10" fill="#c9bade">Enlaces externos → navegador del sistema (Brave)</text>
  <line x1="510" y1="430" x2="510" y2="440" stroke="#6f5a86" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
