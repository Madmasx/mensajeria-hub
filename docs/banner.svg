      <stop offset="1" stop-color="#1a1027"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1010 40) rotate(125) scale(420 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9c6bde" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9c6bde" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(180 420) rotate(-20) scale(320 240)" gradientUnits="userSpaceOnUse">
